    '<div class="arow"><label>Stick</label><input id="dtStick" placeholder="stick id, e.g. 51ccf2"></div>'+
    '<div class="arow"><label>From (ts ≥)</label><input id="dtFrom" placeholder="2026-08-18T00:00"></div>'+
    '<div class="arow"><label>To (ts ≤)</label><input id="dtTo" placeholder="2026-08-19T00:00"></div>'+
    '<div class="arow"><label>Why</label><input id="dtWhy" placeholder="reason (shows in the log)"></div>'+
    '<button class="refresh" onclick="dtIsolate()">Isolate matching data</button> <span id="dtMsg" class="muted"></span></div>'+
    '<div class="prbox"><b>Isolated batches</b><div id="dtList" class="muted">Loading…</div></div>';
  dtList();
}
async function dtPost(body){ const r=await fetch('/api/admin/data',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'labboard'},body:JSON.stringify(body)}); return r.json(); }
async function dtList(){
  const el=document.getElementById('dtList'); if(!el) return;
  try{
    const d=await dtPost({action:'list'});
    if(!d.ok) throw new Error(d.error||'error');
    el.innerHTML=(d.batches&&d.batches.length)?d.batches.map(b=>
      '<div class="app"><span><b>'+esc(b.iso_batch)+'</b><br><span class="muted">'+b.rows_n+' rows · '+b.machines+' machine(s) · '+esc(b.lo_ts||'?')+' → '+esc(b.hi_ts||'?')+(b.iso_why?' · '+esc(b.iso_why):'')+' · by '+esc(b.iso_by||'?')+'</span></span>'+
      '<span><button class="refresh" onclick="dtRestore(\''+esc(b.iso_batch)+'\')">Restore</button> <button class="refresh dtdel" onclick="dtDelete(\''+esc(b.iso_batch)+'\')">Delete…</button></span></div>').join('')
      :'Nothing is isolated right now.';
  }catch(e){ el.textContent='Could not list: '+e.message; }
}
async function dtIsolate(){
  const v=id=>document.getElementById(id).value.trim();
  const msg=document.getElementById('dtMsg'); msg.textContent='Working…';
  try{
    const d=await dtPost({action:'isolate',by:'dashboard',machine:v('dtMachine'),stick:v('dtStick'),from:v('dtFrom'),to:v('dtTo'),why:v('dtWhy')});
    msg.textContent=d.ok?('Isolated '+d.moved+' row(s) into batch '+d.batch+'.'):('Refused: '+(d.error||'error'));
    if(d.ok){ lastHash=''; dtList(); }
  }catch(e){ msg.textContent='Failed: '+e.message; }
}
async function dtRestore(batch){
  try{ const d=await dtPost({action:'restore',batch}); alert(d.ok?('Restored '+d.restored+' row(s).'):('Refused: '+(d.error||'error'))); lastHash=''; dtList(); }
  catch(e){ alert('Failed: '+e.message); }
}
async function dtDelete(batch){
  const t=prompt('This PERMANENTLY deletes batch\n'+batch+'\nfrom the isolated area. There is no undo.\n\nType DELETE to confirm:');
  if(t===null) return;
  try{ const d=await dtPost({action:'delete',batch,confirm:t}); alert(d.ok?('Deleted '+d.deleted+' row(s) permanently.'):('Refused: '+(d.error||'error'))); dtList(); }
  catch(e){ alert('Failed: '+e.message); }
}
async function loadAlerts(){
  const bar=document.getElementById('alertbar');
  try{
    const d=await (await fetch('/api/alerts',{headers:{'Accept':'application/json'}})).json();
    const open=(d.ok&&d.alerts)?d.alerts.filter(a=>!a.acknowledged):[];
    if(open.length){
      bar.innerHTML='<b>&#9888; '+open.length+' open alert'+(open.length>1?'s':'')+':</b> '+
        open.slice(0,6).map(a=>'<span class="a">['+esc(a.level)+'] '+esc(a.kind)+' &mdash; '+esc(a.detail)+(a.stick_id?' ('+esc(a.stick_id)+')':'')+' <span class="muted">'+esc(a.ts)+'</span></span>').join('');
      bar.classList.add('show');
    } else bar.classList.remove('show');
  }catch(e){bar.classList.remove('show')}
}
function closePanel(){document.getElementById('panel').classList.remove('open');window._panelKey='';closeWallPop();}

// ---- tech marks from the dashboard (single machine + multi-select) ----
let selMode=false; const selSet=new Set();
function tsLocal(){ const n=new Date(); return new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,23); }
const MARK_STATES=[['broken','Broken'],['missing','Reported missing'],['verified','Verified'],['override','Override good'],['clear','Clear']];
async function markMachines(machines, state){
  try{
    const r=await fetch('/api/admin/mark',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'labboard'},
      body:JSON.stringify({machines,state,ts:tsLocal()})});
    return await r.json();
  }catch(e){ return {ok:false,error:e.message}; }
}
function markBtnRow(handler){ return '<div class="markrow">'+MARK_STATES.map(([st,lbl])=>'<button class="mbtn m-'+st+'" onclick="'+handler+'(\''+st+'\')">'+lbl+'</button>').join('')+'</div>'; }
async function panelMark(state){
  const machine=window._panelMachine; if(!machine) return;
  const d=await markMachines([machine],state);
  if(d.ok){ closePanel(); lastHash=''; poll(); } else alert('Mark failed: '+(d.error||'error'));
}
// ---- per-PC notes (free-form scratchpad, orthogonal to marks) ----
// A LOG, not a single slot (2026-08-21). The API now sends pcNotes
// (every note since the last clear, newest first); each renders as its own
// block, and the entry box is always BLANK - typing adds a note, it never
// edits the old one. "Clear all notes" posts one empty note, which the fold
// treats as a cutoff hiding everything before it (history stays in D1).
function notesSectionHtml(m){
  const list=(m.pcNotes&&m.pcNotes.length)?m.pcNotes:(m.pcNote?[{note:m.pcNote,by:m.pcNoteBy,ts:m.pcNoteTs}]:[]);
  const cur=list.map(n=>'<div class="pcnote">'+esc(n.note)+
    '<div class="muted" style="margin-top:3px">— '+esc(n.by||'someone')+(n.ts?(' · '+esc(String(n.ts).slice(0,16).replace('T',' '))):'')+'</div></div>').join('');
  return '<div class="marklabel">'+(list.length>1?('Notes ('+list.length+')'):'Note')+'</div>'+cur+
    '<textarea id="pcNoteBox" class="notebox" rows="2" maxlength="500" placeholder="add a note — e.g. cracked screen, RMA pending"></textarea>'+
    '<div class="markrow"><button class="mbtn m-verified" onclick="savePcNote()">Add note</button>'+
    (list.length?'<button class="mbtn m-clear" onclick="clearPcNote()">Clear all notes</button>':'')+'</div>';
}
async function saveNote(machine, note){
  try{
    const r=await fetch('/api/admin/note',{method:'POST',headers:{'Content-Type':'application/json','X-Requested-With':'labboard'},
      body:JSON.stringify({machine,note,ts:tsLocal()})});
    return await r.json();
  }catch(e){ return {ok:false,error:e.message}; }
}
async function savePcNote(){
  const machine=window._panelMachine; if(!machine) return;
  const box=document.getElementById('pcNoteBox');
  const txt=box?box.value.trim():'';
  if(!txt) return;   // blank box = nothing to add; an EMPTY note is the clear-all signal and must never be sent by this button
  const d=await saveNote(machine, txt);
  if(d.ok){ closePanel(); lastHash=''; poll(); } else alert('Note failed: '+(d.error||'error'));
}
async function clearPcNote(){
  const machine=window._panelMachine; if(!machine) return;
  const d=await saveNote(machine,'');
  if(d.ok){ closePanel(); lastHash=''; poll(); } else alert('Note failed: '+(d.error||'error'));
}
function toggleSelMode(){
  selMode=!selMode; if(!selMode) selSet.clear();
  document.body.classList.toggle('selmode',selMode);
  const btn=document.getElementById('selBtn'); if(btn) btn.textContent=selMode?'Cancel select':'Select';
  updateSelBar(); if(DATA) renderGrid(DATA.rooms, searchQ.trim().toLowerCase());
}
function selFromSlot(roomKey,num){
  const room=DATA.rooms.find(r=>r.room===roomKey); if(!room) return;
  const m=room.slots.find(s=>s.num===num); if(!m) return;
  const id=markIdFor(roomKey,m);   // hostname if seen, else "<room>#<num>" for a never-seen slot
  if(selSet.has(id)) selSet.delete(id); else selSet.add(id);
  const el=document.getElementById('t_'+idSafe(roomKey)+'_'+num); if(el) el.classList.toggle('sel',selSet.has(id));
  updateSelBar();
}
function updateSelBar(){
  const bar=document.getElementById('selbar'); if(!bar) return;
  bar.classList.toggle('show',selMode);
  const c=document.getElementById('selcount'); if(c) c.textContent=selSet.size+' selected';
}
async function bulkMark(state){
  if(!selSet.size){ alert('Select machines first (click tiles).'); return; }
  const d=await markMachines([...selSet],state);
  if(d.ok){ selSet.clear(); selMode=false; document.body.classList.remove('selmode');
    const btn=document.getElementById('selBtn'); if(btn) btn.textContent='Select';
    updateSelBar(); lastHash=''; poll(); }
  else alert('Mark failed: '+(d.error||'error'));
}
async function loadFeedStrip(){
  const el=document.getElementById('feedstrip');
  try{
    const d=await (await fetch('/api/feed?limit=4',{headers:{'Accept':'application/json'}})).json();
    if(!d.ok||!d.feed||!d.feed.length){ el.classList.remove('show'); return; }
    el.innerHTML='<span class="fs muted">Live:</span>'+d.feed.map(r=>{
      const v=r.verdict==='installed'?'<span class="ok">installed</span>':r.verdict==='error'?'<span class="err">error</span>':esc(r.verdict);
      return '<span class="fs"><b>'+esc(r.machine)+'</b> '+v+' '+esc(r.app_id)+(r.code?' <span class="muted">('+esc(r.code)+')</span>':'')+'</span>';
    }).join('');
    el.classList.add('show');
  }catch(e){ el.classList.remove('show'); }
}

// ---------- Wall mode: TV view of the whole fleet, autoscaled, read-only ----------
let wallOpen=false, wallSig='';
function openWall(){
  wallOpen=true; wallSig='';
  document.getElementById('wall').classList.add('on');
  if(DATA) renderWall(DATA);
  try{ if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); }catch(e){}
}
function closeWall(){
  wallOpen=false;
  document.getElementById('wall').classList.remove('on');
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
}
// leaving browser fullscreen (Esc) also leaves wall mode - the two travel together
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&wallOpen) closeWall(); });
// every bar carries ALL its segments permanently (zero-width when empty) so a state
// change ANIMATES the slivers growing/shrinking instead of rebuilding the bar.
const WALL_BAR_STATES=[['green','--green'],['purple','--purple'],['yellow','--yellow'],['orange','--orange'],['red','--red'],['blue','--blue'],['broken','--blue']];
let wallStruct='', wallLgSig='', wallTotShown=null;
// count-up/down animation for the big machines total
function wallCountTo(el, target){
  const from=(wallTotShown==null)?target:wallTotShown;
  wallTotShown=target;
  if(from===target){ el.textContent=target; return; }
  const t0=performance.now(), dur=800;
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  (function step(t){
    const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(target-from)*e);
    if(k<1) requestAnimationFrame(step);
  })(t0);
}
function wallBarUpdate(room){
  const sc={}; for(const m of room.slots) sc[m.state]=(sc[m.state]||0)+1;
  for(const [st] of WALL_BAR_STATES){
    const el=document.getElementById('wwb_'+idSafe(room.room)+'_'+st);
    if(el) el.style.flexGrow=String(sc[st]||0);
  }
}
function renderWall(d){
  if(!wallOpen||!d) return;
  const s=d.summary||{};
  // plain-language legend; labels are trusted static strings (orange carries markup)
  const lgSig=JSON.stringify([s.green,s.yellow,s.purple,s.orange,s.red,s.blue,s.broken,s.machines]);
  if(lgSig!==wallLgSig){
    wallLgSig=lgSig;
    document.getElementById('wallLg').innerHTML=[
      ['--green','Done',s.green],
      ['--yellow','Check for Missing Programs',s.yellow],
      ['--purple','Needs GP/CM Run by a Stick',s.purple],
      ['--orange','<u><b>Only</b></u> Needs GP/CM Run by a Stick',s.orange],
      ['--red','Never Touched',s.red],
      ['--blue','Broken/Missing',(s.blue||0)+(s.broken||0)]
    ].map(([c,l,n])=>'<span class="wlgi"><i style="background:var('+c+')"></i><b>'+(n||0)+'</b> '+l+'</span>').join('');
    const tot=document.getElementById('wallTot');
    if(!tot.querySelector('b')) tot.innerHTML='<b>0</b> machines';
    wallCountTo(tot.querySelector('b'), s.machines||0);
    fitWallLegend();
  }
  const rooms=(d.rooms||[]).slice().sort((a,b)=>b.size-a.size);
  const struct=rooms.map(r=>r.room+':'+r.size+':'+r.slots.map(m=>m.num).join(',')).join('|');
  const sig=rooms.map(r=>r.slots.map(m=>m.state).join('')).join('|');
  if(struct===wallStruct){
    if(sig===wallSig) return;
    wallSig=sig;
    // IN-PLACE: recolour tiles + glide the bars - nothing is torn down, so the
    // flex-grow transition actually plays (a rebuilt node can't animate).
    for(const r of rooms){
      r.slots.forEach(m=>{
        const el=document.getElementById('wwt_'+idSafe(r.room)+'_'+m.num); if(!el) return;
        const cls='wt '+m.state+(m.untouched?' untouched':'');
        if(el.className!==cls) el.className=cls;
        const ttl=m.machine||('#'+m.num); if(el.title!==ttl) el.title=ttl;
      });
      wallBarUpdate(r);
      const c=document.getElementById('wwc_'+idSafe(r.room));
      if(c) c.textContent=roomDone(r)+'/'+roomCnt(r);
    }
    return;
  }
  wallStruct=struct; wallSig=sig;
  document.getElementById('wallGrid').innerHTML=rooms.map(r=>{
    const span=Math.max(2,Math.min(12,Math.round(r.size/7)));
    const rid=idSafe(r.room);
    const tiles=r.slots.map(m=>'<i class="wt '+esc(m.state)+(m.untouched?' untouched':'')+'" id="wwt_'+rid+'_'+m.num+'" title="'+esc(m.machine||('#'+m.num))+'" onclick="openWallPop(\''+esc(r.room)+'\','+m.num+',event)">'+tileNum(m)+'</i>').join('');
    const bar=WALL_BAR_STATES.map(([st,c])=>'<i id="wwb_'+rid+'_'+st+'" style="flex:0 1 0;background:var('+c+')"></i>').join('');
    return '<div class="wc" style="grid-column:span '+span+'" onclick="openWallRoomPop(\''+esc(r.room)+'\',event)"><div class="wch"><span>'+esc((r.abbr?r.abbr+' ':'')+r.room)+'</span><div class="wbar">'+bar+'</div><span class="wcd" id="wwc_'+rid+'">'+roomDone(r)+'/'+roomCnt(r)+'</span></div><div class="wtl">'+tiles+'</div></div>';
  }).join('');
  // set initial bar fills AFTER the paint so first appearance glides up from zero
  requestAnimationFrame(()=>{ for(const r of rooms) wallBarUpdate(r); });
  fitWallGrid(); fitWallLegend();
}
// binary-search the biggest tile size where every room still fits the screen.
// The fullscreen TRANSITION fires a resize while the layout is still squashed —
// measuring then concludes "nothing fits" and slams the tiles to the 6px floor
// with no later event to rescue them. So: never fit a mid-transition grid
// (retry instead), and always run a settling pass once the dust clears.
function fitWallGrid(){
  const g=document.getElementById('wallGrid'), w=document.getElementById('wall');
  if(!g||!wallOpen) return;
  if(g.clientHeight<150){ clearTimeout(window._wfw); window._wfw=setTimeout(fitWallGrid,250); return; }
  let lo=6, hi=120, best=6;
  for(let i=0;i<12;i++){
    const mid=(lo+hi)/2;
    w.style.setProperty('--wts',mid+'px');
    // HEIGHT ONLY — tiles wrap, so width cannot truly overflow, but scrollWidth
    // vs clientWidth disagrees by a subpixel after the fullscreen resize (vw
    // padding rounding), which made every size "fail" and collapsed the board
    // to the 6px floor. The mockup only ever checked height; match it.
    if(g.scrollHeight<=g.clientHeight){ best=mid; lo=mid; } else hi=mid;
  }
  w.style.setProperty('--wts',best+'px');
}
// shrink the legend font just enough that all six entries + spacing hold ONE line
function fitWallLegend(){
  const lg=document.getElementById('wallLg'), w=document.getElementById('wall');
  if(!lg||!wallOpen||!lg.clientWidth) return;
  let lo=.45, hi=1, best=.45;
  for(let i=0;i<10;i++){
    const mid=(lo+hi)/2;
    w.style.setProperty('--wlf',mid);
    if(lg.scrollWidth<=lg.clientWidth+1){ best=mid; lo=mid; } else hi=mid;
  }
  w.style.setProperty('--wlf',best);
}
function fitWallBoth(){ fitWallGrid(); fitWallLegend(); }
function fitWallSoon(){ clearTimeout(window._wfw); window._wfw=setTimeout(fitWallBoth,150); clearTimeout(window._wfw2); window._wfw2=setTimeout(fitWallBoth,700); }
window.addEventListener('resize',()=>{ if(wallOpen) fitWallSoon(); });
document.addEventListener('fullscreenchange',()=>{ if(wallOpen) fitWallSoon(); });

let yearSig='';
function populateYears(d){
  const sel=document.getElementById('year');
  const pages=(d.years&&Array.isArray(d.years.pages))?d.years.pages.slice():[];
  if(!pages.length){ sel.style.display='none'; yearSig=''; return; }
  pages.sort((a,b)=>(+b.label)-(+a.label)); // newest first
  const cur = d.year!=null?String(d.year):(d.years.current!=null?String(d.years.current):'');
  // rebuild the dropdown ONLY when the label set changes — otherwise a 5s poll would
  // reset the control under the user's cursor. Selection is kept in sync separately.
  const sig=pages.map(p=>p.label).join(',');
  if(sig!==yearSig){ sel.innerHTML=pages.map(p=>'<option value="'+esc(p.label)+'">'+esc(p.label)+'</option>').join(''); yearSig=sig; }
  if(sel.value!==cur) sel.value=cur;
  sel.style.display='';
}
// ---- dynamic polling (item 11): poll 5s; after 30 min with no change, drop to 60s;
//      any change snaps back to 5s. Change = the fleet's colours/machines differ. ----
let pollTimer=null, lastHash='', lastChange=Date.now();
const POLL_FAST=5000, POLL_SLOW=60000, IDLE_MS=30*60*1000;
function fleetHash(d){ try{ return JSON.stringify(d.summary)+'|'+(d.rooms||[]).map(r=>(r.slots||[]).map(s=>s.state+(s.machine||'')).join('')).join('|'); }catch(e){ return ''+Math.random(); } }
function scheduleNext(){ if(pollTimer) clearTimeout(pollTimer); const idle=(Date.now()-lastChange)>IDLE_MS; pollTimer=setTimeout(poll, idle?POLL_SLOW:POLL_FAST); }
async function poll(){ await load(); scheduleNext(); }

document.getElementById('year').addEventListener('change',e=>{ selectedYear=e.target.value; poll(); });
document.getElementById('refresh').onclick=()=>{ const k=TABS[activeTab-1].kind; if(k==='fleet') poll(); else loadTab(k); };
document.getElementById('search').addEventListener('input',e=>{ searchQ=e.target.value; if(DATA&&activeTab===1) render(DATA); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){
  const wp=document.getElementById('wallPop');
  if(wp&&wp.style.display==='block'){ closeWallPop(); return; }
  if(wallOpen) closeWall(); closePanel(); } });
buildTabs(); selectTab(1); poll();
</script>
